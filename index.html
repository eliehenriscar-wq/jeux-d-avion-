<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pilot Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 15px;
      color: #0f0; background: rgba(0,0,0,0.72);
      padding: 12px 18px; border-radius: 10px;
      font-size: 16px; line-height: 1.5; z-index: 10; pointer-events: none;
    }
    #controls {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 12px; z-index: 10;
    }
    button {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.22); color: white; font-size: 22px;
      backdrop-filter: blur(5px); cursor: pointer;
    }
    #info {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      color: white; background: rgba(0,0,0,0.5); padding: 8px 14px;
      border-radius: 8px; font-size: 13px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Vitès: <span id="speed">0</span> km/h</div>
    <div>Altitid: <span id="alt">3</span> m</div>
    <div>Throttle: <span id="thr">0</span>%</div>
    <div>Manèt: <span id="pad">Pa konekte</span></div>
  </div>

  <div id="info">W/S Pitch | A/D Roll | ← → Yaw | ↑ ↓ Throttle</div>

  <div id="controls">
    <button id="btnPitchUp">↑</button>
    <button id="btnPitchDown">↓</button>
    <button id="btnThrottleUp">+</button>
    <button id="btnThrottleDown">-</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 400, 4000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 7000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(180, 280, 120);
    scene.add(sun);

    // Teren
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(7000, 7000),
      new THREE.MeshLambertMaterial({ color: 0x3a7d44 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Pist
    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 1600),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.1;
    scene.add(runway);

    for (let i = -750; i <= 750; i += 55) {
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(3.5, 28),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.15, i);
      scene.add(line);
    }

    // ===================== AVYON PI REYALIS =====================
    const plane = new THREE.Group();

    // Fuselage (kò)
    const fuselage = new THREE.Mesh(
      new THREE.CylinderGeometry(1.9, 2.2, 22, 16),
      new THREE.MeshLambertMaterial({ color: 0xf5f5f5 })
    );
    fuselage.rotation.z = Math.PI / 2;
    plane.add(fuselage);

    // Nez
    const nose = new THREE.Mesh(
      new THREE.ConeGeometry(1.9, 5, 16),
      new THREE.MeshLambertMaterial({ color: 0xf5f5f5 })
    );
    nose.rotation.z = -Math.PI / 2;
    nose.position.x = 13.5;
    plane.add(nose);

    // Cockpit
    const cockpit = new THREE.Mesh(
      new THREE.SphereGeometry(2, 14, 14, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshLambertMaterial({ color: 0x3a7bd5, transparent: true, opacity: 0.78 })
    );
    cockpit.position.set(8, 1.4, 0);
    cockpit.rotation.z = -Math.PI / 2;
    plane.add(cockpit);

    // Zèl prensipal
    const wing = new THREE.Mesh(
      new THREE.BoxGeometry(32, 0.4, 5),
      new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
    );
    wing.position.set(0, 0.3, 0);
    plane.add(wing);

    // Winglet gòch
    const wingletL = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 1.8, 1.2),
      new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
    );
    wingletL.position.set(0, 1.1, 15.5);
    plane.add(wingletL);

    // Winglet dwat
    const wingletR = wingletL.clone();
    wingletR.position.z = -15.5;
    plane.add(wingletR);

    // Motè
    const engMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
    const engGeo = new THREE.CylinderGeometry(1.15, 1.15, 3.8, 12);

    const eng1 = new THREE.Mesh(engGeo, engMat);
    eng1.rotation.z = Math.PI / 2;
    eng1.position.set(1.5, -1.1, 8);
    plane.add(eng1);

    const eng2 = eng1.clone();
    eng2.position.z = -8;
    plane.add(eng2);

    // Ke vètikal
    const vStab = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 5.5, 4),
      new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
    );
    vStab.position.set(-10.5, 3.1, 0);
    plane.add(vStab);

    // Ke orizontal
    const hStab = new THREE.Mesh(
      new THREE.BoxGeometry(9, 0.3, 2.4),
      new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })
    );
    hStab.position.set(-10.5, 1.3, 0);
    plane.add(hStab);

    // Wou
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 12);

    const wFront = new THREE.Mesh(wheelGeo, wheelMat);
    wFront.rotation.x = Math.PI / 2;
    wFront.position.set(9, -2.4, 0);
    plane.add(wFront);

    const wL = new THREE.Mesh(wheelGeo, wheelMat);
    wL.rotation.x = Math.PI / 2;
    wL.position.set(-1, -2.5, 4);
    plane.add(wL);

    const wR = wL.clone();
    wR.position.z = -4;
    plane.add(wR);

    plane.position.set(0, 3.2, 450);
    scene.add(plane);

    // ===================== ETA =====================
    let speed = 0;
    let throttle = 0;
    let onGround = true;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const addBtn = (id, code) => {
      const b = document.getElementById(id);
      b.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
      b.addEventListener('touchend', () => keys[code] = false);
      b.addEventListener('mousedown', () => keys[code] = true);
      b.addEventListener('mouseup', () => keys[code] = false);
    };
    addBtn('btnPitchUp', 'KeyW');
    addBtn('btnPitchDown', 'KeyS');
    addBtn('btnThrottleUp', 'ArrowUp');
    addBtn('btnThrottleDown', 'ArrowDown');

    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", e => {
      gamepadIndex = e.gamepad.index;
      document.getElementById('pad').textContent = "Konekte ✓";
    });
    window.addEventListener("gamepaddisconnected", () => {
      gamepadIndex = null;
      document.getElementById('pad').textContent = "Pa konekte";
    });

    function update(delta) {
      const gp = gamepadIndex !== null ? navigator.getGamepads()[gamepadIndex] : null;

      if (keys['ArrowUp']) throttle = Math.min(1, throttle + 0.5 * delta);
      if (keys['ArrowDown']) throttle = Math.max(0, throttle - 0.5 * delta);
      if (gp && gp.buttons[7]) throttle = gp.buttons[7].value;

      let pitch = 0, roll = 0, yaw = 0;
      if (keys['KeyW']) pitch = 1;
      if (keys['KeyS']) pitch = -1;
      if (keys['KeyA']) roll = 1;
      if (keys['KeyD']) roll = -1;
      if (keys['ArrowLeft']) yaw = 1;
      if (keys['ArrowRight']) yaw = -1;

      if (gp) {
        pitch = -gp.axes[1];
        roll = -gp.axes[0];
        yaw = -gp.axes[2];
      }

      speed += (throttle * 100 - speed * 0.055) * delta;
      if (speed < 0) speed = 0;

      if (onGround) {
        if (speed > 175) onGround = false;
        if (keys['Space'] || (gp && gp.buttons[0]?.pressed)) speed = Math.max(0, speed - 90 * delta);
      }

      plane.rotation.x += pitch * 0.8 * delta;
      plane.rotation.z += roll * 0.8 * delta;
      plane.rotation.y += yaw * 0.8 * delta;
      plane.rotation.x = Math.max(-0.65, Math.min(0.65, plane.rotation.x));

      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(plane.quaternion);
      plane.position.add(dir.multiplyScalar(speed * 0.18 * delta));

      if (!onGround) {
        plane.position.y += (speed * 0.0024 - 1.45) * delta;
        if (plane.position.y < 3.2) {
          plane.position.y = 3.2;
          onGround = true;
          plane.rotation.x *= 0.3;
        }
      } else {
        plane.position.y = 3.2;
      }

      const offset = new THREE.Vector3(0, 11, 30);
      offset.applyQuaternion(plane.quaternion);
      camera.position.copy(plane.position).add(offset);
      camera.lookAt(plane.position);

      document.getElementById('speed').textContent = Math.round(speed);
      document.getElementById('alt').textContent = Math.round(plane.position.y);
      document.getElementById('thr').textContent = Math.round(throttle * 100);
    }

    let last = performance.now();
    function animate(t) {
      const delta = Math.min((t - last) / 1000, 0.05);
      last = t;
      update(delta);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate(performance.now());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
