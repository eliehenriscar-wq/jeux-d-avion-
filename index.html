<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pilot Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 15px;
      color: #0f0; background: rgba(0,0,0,0.75);
      padding: 12px 18px; border-radius: 10px;
      font-size: 16px; line-height: 1.5; z-index: 10; pointer-events: none;
      border: 1px solid rgba(0,255,100,0.3);
    }
    #controls {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 12px; z-index: 10;
    }
    button {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.22); color: white; font-size: 22px;
      backdrop-filter: blur(5px); cursor: pointer;
    }
    #info {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      color: white; background: rgba(0,0,0,0.55); padding: 8px 14px;
      border-radius: 8px; font-size: 13px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Vitès: <span id="speed">0</span> km/h</div>
    <div>Altitid: <span id="alt">3</span> m</div>
    <div>Throttle: <span id="thr">0</span>%</div>
    <div>Manèt: <span id="pad">Pa konekte</span></div>
  </div>

  <div id="info">W/S Pitch | A/D Roll | ← → Yaw | ↑ ↓ Throttle</div>

  <div id="controls">
    <button id="btnPitchUp">↑</button>
    <button id="btnPitchDown">↓</button>
    <button id="btnThrottleUp">+</button>
    <button id="btnThrottleDown">-</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 500, 4500);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Luzes
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.25);
    sun.position.set(200, 320, 150);
    sun.castShadow = true;
    scene.add(sun);

    // ===================== TERRENO =====================
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(8000, 8000),
      new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===================== PISTA MODERNA =====================
    // Asfalto principal
    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(95, 1800),
      new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.12;
    runway.receiveShadow = true;
    scene.add(runway);

    // Bordas laterais da pista (amarelo)
    function createEdge(x) {
      const edge = new THREE.Mesh(
        new THREE.PlaneGeometry(1.8, 1800),
        new THREE.MeshBasicMaterial({ color: 0xf5c518 })
      );
      edge.rotation.x = -Math.PI / 2;
      edge.position.set(x, 0.13, 0);
      scene.add(edge);
    }
    createEdge(46);
    createEdge(-46);

    // Linha central branca (tracejada moderna)
    for (let i = -850; i <= 850; i += 48) {
      const center = new THREE.Mesh(
        new THREE.PlaneGeometry(2.2, 22),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      center.rotation.x = -Math.PI / 2;
      center.position.set(0, 0.14, i);
      scene.add(center);
    }

    // Threshold markings (barras no início da pista)
    for (let i = 0; i < 8; i++) {
      const barL = new THREE.Mesh(
        new THREE.PlaneGeometry(3.5, 28),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      barL.rotation.x = -Math.PI / 2;
      barL.position.set(-18 + i * 5, 0.15, 820);
      scene.add(barL);

      const barR = barL.clone();
      barR.position.x = 18 - i * 5;
      scene.add(barR);
    }

    // Número da pista (simples)
    const numberMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const numGeo = new THREE.PlaneGeometry(12, 18);
    const num1 = new THREE.Mesh(numGeo, numberMat);
    num1.rotation.x = -Math.PI / 2;
    num1.position.set(-8, 0.16, 780);
    scene.add(num1);

    // ===================== AVIÃO MAIS REALISTA E ESTILOSO =====================
    const plane = new THREE.Group();

    // Materiais modernos
    const bodyMat = new THREE.MeshStandardMaterial({ 
      color: 0xf8f8f8, 
      metalness: 0.35, 
      roughness: 0.4 
    });
    const darkMat = new THREE.MeshStandardMaterial({ 
      color: 0x222222, 
      metalness: 0.6, 
      roughness: 0.3 
    });
    const glassMat = new THREE.MeshStandardMaterial({ 
      color: 0x1a4a8a, 
      transparent: true, 
      opacity: 0.82,
      metalness: 0.2,
      roughness: 0.1
    });
    const accentMat = new THREE.MeshStandardMaterial({ 
      color: 0x0a3d7a, 
      metalness: 0.4, 
      roughness: 0.35 
    });

    // Fuselagem principal (mais alongada e elegante)
    const fuselage = new THREE.Mesh(
      new THREE.CylinderGeometry(1.85, 2.15, 26, 20),
      bodyMat
    );
    fuselage.rotation.z = Math.PI / 2;
    fuselage.castShadow = true;
    plane.add(fuselage);

    // Nariz (cone mais suave)
    const nose = new THREE.Mesh(
      new THREE.ConeGeometry(1.85, 6.5, 18),
      bodyMat
    );
    nose.rotation.z = -Math.PI / 2;
    nose.position.x = 16.2;
    nose.castShadow = true;
    plane.add(nose);

    // Cockpit (mais visível e moderno)
    const cockpit = new THREE.Mesh(
      new THREE.SphereGeometry(2.15, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      glassMat
    );
    cockpit.position.set(9.5, 1.55, 0);
    cockpit.rotation.z = -Math.PI / 2;
    plane.add(cockpit);

    // Faixa azul decorativa na fuselagem
    const stripe = new THREE.Mesh(
      new THREE.CylinderGeometry(2.18, 2.18, 18, 16, 1, true),
      accentMat
    );
    stripe.rotation.z = Math.PI / 2;
    stripe.position.y = 0.15;
    plane.add(stripe);

    // Asa principal (mais larga e moderna)
    const wing = new THREE.Mesh(
      new THREE.BoxGeometry(36, 0.38, 5.8),
      bodyMat
    );
    wing.position.set(1, 0.25, 0);
    wing.castShadow = true;
    plane.add(wing);

    // Winglets
    const wingletGeo = new THREE.BoxGeometry(0.35, 2.2, 1.4);
    const wingletL = new THREE.Mesh(wingletGeo, bodyMat);
    wingletL.position.set(1, 1.35, 17.5);
    wingletL.rotation.x = 0.15;
    plane.add(wingletL);

    const wingletR = wingletL.clone();
    wingletR.position.z = -17.5;
    wingletR.rotation.x = -0.15;
    plane.add(wingletR);

    // Motores (mais detalhados)
    const engMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, metalness: 0.7, roughness: 0.25 });
    const engGeo = new THREE.CylinderGeometry(1.25, 1.35, 4.4, 14);

    const eng1 = new THREE.Mesh(engGeo, engMat);
    eng1.rotation.z = Math.PI / 2;
    eng1.position.set(2.2, -1.35, 9.2);
    eng1.castShadow = true;
    plane.add(eng1);

    const eng2 = eng1.clone();
    eng2.position.z = -9.2;
    plane.add(eng2);

    // Entrada de ar dos motores (anel)
    const intakeGeo = new THREE.TorusGeometry(1.28, 0.18, 10, 20);
    const intake1 = new THREE.Mesh(intakeGeo, darkMat);
    intake1.rotation.y = Math.PI / 2;
    intake1.position.set(4.4, -1.35, 9.2);
    plane.add(intake1);

    const intake2 = intake1.clone();
    intake2.position.z = -9.2;
    plane.add(intake2);

    // Cauda vertical
    const vStab = new THREE.Mesh(
      new THREE.BoxGeometry(0.45, 6.2, 4.5),
      bodyMat
    );
    vStab.position.set(-12.2, 3.4, 0);
    vStab.castShadow = true;
    plane.add(vStab);

    // Cauda horizontal
    const hStab = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.32, 2.8),
      bodyMat
    );
    hStab.position.set(-12.2, 1.4, 0);
    plane.add(hStab);

    // Trem de pouso
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
    const wheelGeo = new THREE.CylinderGeometry(0.48, 0.48, 0.38, 14);

    // Roda dianteira
    const wFront = new THREE.Mesh(wheelGeo, wheelMat);
    wFront.rotation.x = Math.PI / 2;
    wFront.position.set(10.5, -2.55, 0);
    plane.add(wFront);

    // Rodas principais
    const wL = new THREE.Mesh(wheelGeo, wheelMat);
    wL.rotation.x = Math.PI / 2;
    wL.position.set(-0.8, -2.65, 4.3);
    plane.add(wL);

    const wR = wL.clone();
    wR.position.z = -4.3;
    plane.add(wR);

    // Suportes do trem de pouso
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.6);

    const legF = new THREE.Mesh(legGeo, legMat);
    legF.position.set(10.5, -1.7, 0);
    plane.add(legF);

    const legL = new THREE.Mesh(legGeo, legMat);
    legL.position.set(-0.8, -1.8, 4.3);
    plane.add(legL);

    const legR = legL.clone();
    legR.position.z = -4.3;
    plane.add(legR);

    plane.position.set(0, 3.4, 450);
    scene.add(plane);

    // ===================== CONTROLES =====================
    let speed = 0;
    let throttle = 0;
    let onGround = true;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const addBtn = (id, code) => {
      const b = document.getElementById(id);
      b.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
      b.addEventListener('touchend', () => keys[code] = false);
      b.addEventListener('mousedown', () => keys[code] = true);
      b.addEventListener('mouseup', () => keys[code] = false);
    };
    addBtn('btnPitchUp', 'KeyW');
    addBtn('btnPitchDown', 'KeyS');
    addBtn('btnThrottleUp', 'ArrowUp');
    addBtn('btnThrottleDown', 'ArrowDown');

    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", e => {
      gamepadIndex = e.gamepad.index;
      document.getElementById('pad').textContent = "Konekte ✓";
    });
    window.addEventListener("gamepaddisconnected", () => {
      gamepadIndex = null;
      document.getElementById('pad').textContent = "Pa konekte";
    });

    function update(delta) {
      const gp = gamepadIndex !== null ? navigator.getGamepads()[gamepadIndex] : null;

      if (keys['ArrowUp']) throttle = Math.min(1, throttle + 0.5 * delta);
      if (keys['ArrowDown']) throttle = Math.max(0, throttle - 0.5 * delta);
      if (gp && gp.buttons[7]) throttle = gp.buttons[7].value;

      let pitch = 0, roll = 0, yaw = 0;
      if (keys['KeyW']) pitch = 1;
      if (keys['KeyS']) pitch = -1;
      if (keys['KeyA']) roll = 1;
      if (keys['KeyD']) roll = -1;
      if (keys['ArrowLeft']) yaw = 1;
      if (keys['ArrowRight']) yaw = -1;

      if (gp) {
        pitch = -gp.axes[1];
        roll = -gp.axes[0];
        yaw = -gp.axes[2];
      }

      speed += (throttle * 100 - speed * 0.055) * delta;
      if (speed < 0) speed = 0;

      if (onGround) {
        if (speed > 175) onGround = false;
        if (keys['Space'] || (gp && gp.buttons[0]?.pressed)) speed = Math.max(0, speed - 90 * delta);
      }

      plane.rotation.x += pitch * 0.8 * delta;
      plane.rotation.z += roll * 0.8 * delta;
      plane.rotation.y += yaw * 0.8 * delta;
      plane.rotation.x = Math.max(-0.65, Math.min(0.65, plane.rotation.x));

      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(plane.quaternion);
      plane.position.add(dir.multiplyScalar(speed * 0.18 * delta));

      if (!onGround) {
        plane.position.y += (speed * 0.0024 - 1.45) * delta;
        if (plane.position.y < 3.4) {
          plane.position.y = 3.4;
          onGround = true;
          plane.rotation.x *= 0.3;
        }
      } else {
        plane.position.y = 3.4;
      }

      const offset = new THREE.Vector3(0, 12, 32);
      offset.applyQuaternion(plane.quaternion);
      camera.position.copy(plane.position).add(offset);
      camera.lookAt(plane.position);

      document.getElementById('speed').textContent = Math.round(speed);
      document.getElementById('alt').textContent = Math.round(plane.position.y);
      document.getElementById('thr').textContent = Math.round(throttle * 100);
    }

    let last = performance.now();
    function animate(t) {
      const delta = Math.min((t - last) / 1000, 0.05);
      last = t;
      update(delta);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate(performance.now());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
