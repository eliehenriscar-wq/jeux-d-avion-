<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pilot Simulator - Avyon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #0f0;
      background: rgba(0,0,0,0.6);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
      z-index: 10;
      pointer-events: none;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 20px;
      backdrop-filter: blur(5px);
    }
    #info {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Vitès: <span id="speed">0</span> km/h</div>
    <div>Altitid: <span id="alt">0</span> m</div>
    <div>Throttle: <span id="thr">0</span>%</div>
    <div>Manèt: <span id="pad">Pa konekte</span></div>
  </div>

  <div id="info">W/S Pitch | A/D Roll | ←→ Yaw | ↑↓ Throttle | Manèt sipòte</div>

  <div id="controls">
    <button id="btnPitchUp">↑</button>
    <button id="btnPitchDown">↓</button>
    <button id="btnThrottleUp">+</button>
    <button id="btnThrottleDown">-</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 100, 2000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(100, 200, 50);
    scene.add(sun);

    const groundGeo = new THREE.PlaneGeometry(4000, 4000);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d44 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const runwayGeo = new THREE.PlaneGeometry(60, 800);
    const runwayMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const runway = new THREE.Mesh(runwayGeo, runwayMat);
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.1;
    scene.add(runway);

    for (let i = -350; i <= 350; i += 40) {
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.15, i);
      scene.add(line);
    }

    const plane = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(1.2, 1.5, 12, 8),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    body.rotation.z = Math.PI / 2;
    plane.add(body);

    const wing = new THREE.Mesh(
      new THREE.BoxGeometry(18, 0.3, 3),
      new THREE.MeshLambertMaterial({ color: 0xdddddd })
    );
    wing.position.y = 0.3;
    plane.add(wing);

    const tail = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 3, 2),
      new THREE.MeshLambertMaterial({ color: 0xdddddd })
    );
    tail.position.set(-5.5, 1.5, 0);
    plane.add(tail);

    const horizontalStab = new THREE.Mesh(
      new THREE.BoxGeometry(5, 0.2, 1.5),
      new THREE.MeshLambertMaterial({ color: 0xdddddd })
    );
    horizontalStab.position.set(-5.5, 0.8, 0);
    plane.add(horizontalStab);

    const cockpit = new THREE.Mesh(
      new THREE.SphereGeometry(1.3, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.7 })
    );
    cockpit.position.set(3.5, 0.8, 0);
    cockpit.rotation.z = -Math.PI / 2;
    plane.add(cockpit);

    plane.position.set(0, 2, 300);
    scene.add(plane);

    let speed = 0;
    let throttle = 0;
    let altitude = 2;
    let onGround = true;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('btnPitchUp').addEventListener('touchstart', () => keys['KeyW'] = true);
    document.getElementById('btnPitchUp').addEventListener('touchend', () => keys['KeyW'] = false);
    document.getElementById('btnPitchDown').addEventListener('touchstart', () => keys['KeyS'] = true);
    document.getElementById('btnPitchDown').addEventListener('touchend', () => keys['KeyS'] = false);
    document.getElementById('btnThrottleUp').addEventListener('touchstart', () => keys['ArrowUp'] = true);
    document.getElementById('btnThrottleUp').addEventListener('touchend', () => keys['ArrowUp'] = false);
    document.getElementById('btnThrottleDown').addEventListener('touchstart', () => keys['ArrowDown'] = true);
    document.getElementById('btnThrottleDown').addEventListener('touchend', () => keys['ArrowDown'] = false);

    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      document.getElementById('pad').textContent = "Konekte ✓";
    });
    window.addEventListener("gamepaddisconnected", () => {
      gamepadIndex = null;
      document.getElementById('pad').textContent = "Pa konekte";
    });

    function getGamepadInput() {
      if (gamepadIndex === null) return null;
      const gp = navigator.getGamepads()[gamepadIndex];
      if (!gp) return null;
      return {
        pitch: gp.axes[1] || 0,
        roll: gp.axes[0] || 0,
        yaw: gp.axes[2] || 0,
        throttle: gp.buttons[7] ? gp.buttons[7].value : (gp.axes[3] ? (-gp.axes[3] + 1) / 2 : 0),
        brake: gp.buttons[0] && gp.buttons[0].pressed
      };
    }

    function update(delta) {
      const gp = getGamepadInput();

      if (keys['ArrowUp'] || (gp && gp.throttle > 0.1)) {
        throttle = Math.min(1, throttle + 0.4 * delta);
      }
      if (keys['ArrowDown']) {
        throttle = Math.max(0, throttle - 0.4 * delta);
      }
      if (gp && gp.throttle > 0.05) {
        throttle = gp.throttle;
      }

      let pitchInput = 0, rollInput = 0, yawInput = 0;
      if (keys['KeyW']) pitchInput = 1;
      if (keys['KeyS']) pitchInput = -1;
      if (keys['KeyA']) rollInput = 1;
      if (keys['KeyD']) rollInput = -1;
      if (keys['ArrowLeft']) yawInput = 1;
      if (keys['ArrowRight']) yawInput = -1;

      if (gp) {
        pitchInput = -gp.pitch;
        rollInput = -gp.roll;
        yawInput = -gp.yaw;
      }

      const accel = throttle * 80 - (speed * 0.08);
      speed = Math.max(0, speed + accel * delta);

      if (onGround) {
        if (speed > 180) onGround = false;
        if (keys['Space'] || (gp && gp.brake)) {
          speed = Math.max(0, speed - 60 * delta);
        }
      }

      const sensitivity = 0.8;
      plane.rotation.x += pitchInput * sensitivity * delta;
      plane.rotation.z += rollInput * sensitivity * delta;
      plane.rotation.y += yawInput * sensitivity * delta;
      plane.rotation.x = Math.max(-0.8, Math.min(0.8, plane.rotation.x));

      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(plane.quaternion);
      const moveSpeed = speed * 0.15 * delta;
      plane.position.add(direction.multiplyScalar(moveSpeed));

      if (!onGround) {
        const lift = speed * 0.002;
        plane.position.y += (lift - 9.8 * 0.15) * delta;
        if (plane.position.y < 2) {
          plane.position.y = 2;
          onGround = true;
          plane.rotation.x *= 0.5;
        }
      } else {
        plane.position.y = 2;
      }

      altitude = Math.max(0, plane.position.y);

      const camOffset = new THREE.Vector3(0, 6, 18);
      camOffset.applyQuaternion(plane.quaternion);
      camera.position.copy(plane.position).add(camOffset);
      camera.lookAt(plane.position);

      document.getElementById('speed').textContent = Math.round(speed);
      document.getElementById('alt').textContent = Math.round(altitude);
      document.getElementById('thr').textContent = Math.round(throttle * 100);
    }

    let lastTime = performance.now();
    function animate(time) {
      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      update(delta);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
