<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pilot Simulator - Avyon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 15px;
      color: #0f0; background: rgba(0,0,0,0.65);
      padding: 12px 18px; border-radius: 10px;
      font-size: 16px; line-height: 1.6; z-index: 10; pointer-events: none;
    }
    #controls {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 14px; z-index: 10;
    }
    button {
      width: 62px; height: 62px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.25); color: white; font-size: 22px;
      backdrop-filter: blur(6px); cursor: pointer;
    }
    #info {
      position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%);
      color: white; background: rgba(0,0,0,0.55); padding: 8px 16px;
      border-radius: 8px; font-size: 14px; z-index: 10; white-space: nowrap;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 20px; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="loading">Ap chaje avyon an...</div>

  <div id="ui">
    <div>Vitès: <span id="speed">0</span> km/h</div>
    <div>Altitid: <span id="alt">3</span> m</div>
    <div>Throttle: <span id="thr">0</span>%</div>
    <div>Manèt: <span id="pad">Pa konekte</span></div>
  </div>

  <div id="info">W/S Pitch | A/D Roll | ← → Yaw | ↑ ↓ Throttle | Manèt sipòte</div>

  <div id="controls">
    <button id="btnPitchUp">↑</button>
    <button id="btnPitchDown">↓</button>
    <button id="btnThrottleUp">+</button>
    <button id="btnThrottleDown">-</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 300, 4000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(200, 300, 150);
    scene.add(sun);

    // Teren + Pist
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(8000, 8000),
      new THREE.MeshLambertMaterial({ color: 0x3a7d44 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 1500),
      new THREE.MeshLambertMaterial({ color: 0x2a2a2a })
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.1;
    scene.add(runway);

    for (let i = -700; i <= 700; i += 55) {
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(3.5, 28),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.15, i);
      scene.add(line);
    }

    // ========== CHAGE MODÈL AVYON ==========
    let plane = null;
    const loader = new THREE.GLTFLoader();

    loader.load('plane.glb', function(gltf) {
      plane = gltf.scene;

      // Ajiste gwosè avyon an (ou ka chanje 0.8 si li twò gwo oswa twò piti)
      plane.scale.set(0.8, 0.8, 0.8);

      // Mete l sou pist la
      plane.position.set(0, 0, 450);
      plane.rotation.y = Math.PI; // vire l nan bon direksyon

      scene.add(plane);
      document.getElementById('loading').style.display = 'none';
    }, undefined, function(error) {
      console.error(error);
      document.getElementById('loading').textContent = "Erè: pa jwenn plane.glb";
    });

    // ========== ETA ==========
    let speed = 0;
    let throttle = 0;
    let onGround = true;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const addTouch = (id, code) => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
      btn.addEventListener('touchend', () => keys[code] = false);
      btn.addEventListener('mousedown', () => keys[code] = true);
      btn.addEventListener('mouseup', () => keys[code] = false);
    };
    addTouch('btnPitchUp', 'KeyW');
    addTouch('btnPitchDown', 'KeyS');
    addTouch('btnThrottleUp', 'ArrowUp');
    addTouch('btnThrottleDown', 'ArrowDown');

    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", e => {
      gamepadIndex = e.gamepad.index;
      document.getElementById('pad').textContent = "Konekte ✓";
    });
    window.addEventListener("gamepaddisconnected", () => {
      gamepadIndex = null;
      document.getElementById('pad').textContent = "Pa konekte";
    });

    function getGamepad() {
      if (gamepadIndex === null) return null;
      return navigator.getGamepads()[gamepadIndex] || null;
    }

    function update(delta) {
      if (!plane) return;

      const gp = getGamepad();

      if (keys['ArrowUp']) throttle = Math.min(1, throttle + 0.5 * delta);
      if (keys['ArrowDown']) throttle = Math.max(0, throttle - 0.5 * delta);
      if (gp && gp.buttons[7]) throttle = gp.buttons[7].value;

      let pitchInput = 0, rollInput = 0, yawInput = 0;
      if (keys['KeyW']) pitchInput = 1;
      if (keys['KeyS']) pitchInput = -1;
      if (keys['KeyA']) rollInput = 1;
      if (keys['KeyD']) rollInput = -1;
      if (keys['ArrowLeft']) yawInput = 1;
      if (keys['ArrowRight']) yawInput = -1;

      if (gp) {
        pitchInput = -gp.axes[1];
        rollInput = -gp.axes[0];
        yawInput = -gp.axes[2];
      }

      const accel = throttle * 100 - speed * 0.06;
      speed += accel * delta;
      if (speed < 0) speed = 0;

      if (onGround) {
        if (speed > 180) onGround = false;
        if (keys['Space'] || (gp && gp.buttons[0]?.pressed)) {
          speed = Math.max(0, speed - 90 * delta);
        }
      }

      const sens = 0.8;
      plane.rotation.x += pitchInput * sens * delta;
      plane.rotation.z += rollInput * sens * delta;
      plane.rotation.y += yawInput * sens * delta;
      plane.rotation.x = Math.max(-0.65, Math.min(0.65, plane.rotation.x));

      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(plane.quaternion);
      plane.position.add(dir.multiplyScalar(speed * 0.18 * delta));

      if (!onGround) {
        const lift = speed * 0.0025;
        plane.position.y += (lift - 1.5) * delta;
        if (plane.position.y < 2) {
          plane.position.y = 2;
          onGround = true;
          plane.rotation.x *= 0.3;
        }
      } else {
        plane.position.y = 2;
      }

      // Camera
      const offset = new THREE.Vector3(0, 12, 35);
      offset.applyQuaternion(plane.quaternion);
      camera.position.copy(plane.position).add(offset);
      camera.lookAt(plane.position);

      document.getElementById('speed').textContent = Math.round(speed);
      document.getElementById('alt').textContent = Math.round(plane.position.y);
      document.getElementById('thr').textContent = Math.round(throttle * 100);
    }

    let last = performance.now();
    function animate(now) {
      const delta = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(delta);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate(performance.now());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
